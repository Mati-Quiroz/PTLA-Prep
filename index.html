<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTLA Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="inicio">
  <h1>PTLA PRACTICE</h1>
  <h2>Selecciona una materia</h2>
  <div id="materias"></div>
</div>

<div id="quiz" style="display:none;">
  <div class="barra">
    <div id="contador">Pregunta 0/0</div>
    <div id="aciertos">Aciertos: 0</div>
    <div id="fallos">Fallos: 0</div>
  </div>

  <div class="pregunta-container">
    <h2 id="pregunta"></h2>
    <div id="opciones"></div>
  </div>

  <div id="resultado"></div>
  <button id="siguiente">Siguiente</button>
  <button id="volver">Volver a materias</button>
</div>

<div id="final" style="display:none;">
  <h1>Resultado Final</h1>
  <div id="resumen"></div>
  <button onclick="location.reload()">Volver al Inicio</button>
</div>

<script src="app.js"></script>
</body>
</html>
